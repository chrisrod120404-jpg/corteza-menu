<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Corteza Oculta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,400&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0A08;--bg2:#161310;--bg3:#1F1A15;--bg4:#2A231C;
  --cream:#F2EBE0;--cream2:#E8DDD0;
  --ember:#D4521E;--ember2:#E8733F;--ember3:#F59060;
  --gold2:#E8B84B;--green:#2E7D52;--green2:#3DAA6E;
  --ink3:#8A7A6A;--ink4:#5A4E42;
  --line:rgba(242,235,224,.08);--line2:rgba(242,235,224,.15);
  --r:12px;--rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--cream);font-family:'Instrument Sans',sans-serif;min-height:100dvh}

/* LOGIN */
.login-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:0}
.login-mark{width:72px;height:72px;border-radius:50%;background:var(--ember);
  display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px;
  box-shadow:0 0 0 12px rgba(212,82,30,.15);}
.login-title{font-family:'Fraunces',serif;font-size:28px;font-weight:900;color:var(--cream);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--ink3);margin-bottom:32px;line-height:1.5}
.google-btn{display:flex;align-items:center;gap:12px;background:var(--cream);color:#1C1710;
  border:none;border-radius:var(--r);padding:14px 24px;font-family:'Instrument Sans',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;margin:0 auto;}
.google-btn:hover{opacity:.9}
.google-btn svg{width:20px;height:20px;flex-shrink:0}
.login-note{font-size:11px;color:var(--ink4);margin-top:16px}

/* HEADER */
.hdr{background:var(--bg2);border-bottom:1px solid var(--line2);
  padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--cream)}
.hdr-logo em{color:var(--ember3);font-style:italic}
.hdr-logo span{font-size:11px;font-weight:500;color:var(--ink3);margin-left:8px;
  background:var(--bg3);border:1px solid var(--line2);border-radius:99px;padding:2px 8px;}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3)}
.user-name{font-size:13px;color:var(--ink3);display:none}
@media(min-width:480px){.user-name{display:block}}
.logout-btn{font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;
  background:transparent;border:1px solid var(--line2);border-radius:var(--rsm);
  padding:5px 10px;font-family:'Instrument Sans',sans-serif;transition:all .15s;}
.logout-btn:hover{color:var(--cream);border-color:var(--line2)}

/* MAIN */
.main{padding:20px 16px;max-width:900px;margin:0 auto}
.page-title{font-family:'Fraunces',serif;font-size:26px;font-weight:900;color:var(--cream);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--ink3);margin-bottom:24px}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line2);
  border-radius:var(--r);padding:4px;margin-bottom:24px;}
.tab{flex:1;text-align:center;padding:9px 12px;border-radius:var(--rsm);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--ink3);}
.tab.active{background:var(--ember);color:var(--cream)}
.tab:hover:not(.active){color:var(--cream)}

/* RECIPE GRID */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.recipe-card{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.recipe-card:hover{border-color:var(--ember)}
.rc-img{width:100%;height:120px;object-fit:cover;background:var(--bg3);display:block;
  display:flex;align-items:center;justify-content:center;font-size:40px;}
.rc-img img{width:100%;height:100%;object-fit:cover}
.rc-body{padding:12px}
.rc-name{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--cream);margin-bottom:4px}
.rc-cat{font-size:11px;color:var(--ink3);margin-bottom:10px;letter-spacing:.4px;text-transform:uppercase}
.rc-actions{display:flex;gap:6px}

/* BUTTONS */
.btn{font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:600;
  border-radius:var(--rsm);padding:7px 12px;cursor:pointer;border:none;transition:all .15s;}
.btn-ember{background:var(--ember);color:var(--cream)}
.btn-ember:hover{background:var(--ember2)}
.btn-ghost{background:transparent;color:var(--ink3);border:1px solid var(--line2)}
.btn-ghost:hover{color:var(--cream);border-color:var(--line2)}
.btn-green{background:var(--green);color:var(--cream)}
.btn-green:hover{background:var(--green2)}
.btn-full{width:100%;padding:12px 18px;font-size:14px;font-weight:700;
  border-radius:var(--r);border:none;cursor:pointer;font-family:'Instrument Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}

/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--line2);border-radius:var(--r);padding:32px 20px;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--bg3);position:relative;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--ember);background:rgba(212,82,30,.06)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.uz-icon{font-size:36px;margin-bottom:10px;display:block}
.uz-text{font-size:14px;font-weight:600;color:var(--cream);margin-bottom:4px}
.uz-sub{font-size:12px;color:var(--ink3)}
.upload-preview{width:100%;max-height:200px;object-fit:cover;border-radius:var(--rsm);
  margin-top:12px;display:none;}

/* PROGRESS */
.progress-bar{height:4px;background:var(--line2);border-radius:99px;margin-top:12px;overflow:hidden;display:none}
.progress-fill{height:100%;background:var(--ember);border-radius:99px;width:0%;transition:width .3s}

/* STATUS BADGE */
.status{display:inline-flex;align-items:center;gap:5px;
  border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.3px}
.status.pending{background:rgba(200,144,26,.18);color:var(--gold2);border:1px solid rgba(200,144,26,.3)}
.status.confirmed{background:rgba(46,125,82,.18);color:var(--green2);border:1px solid rgba(46,125,82,.3)}
.status.preparing{background:rgba(212,82,30,.18);color:var(--ember3);border:1px solid rgba(212,82,30,.3)}
.status.delivered{background:rgba(46,125,82,.25);color:var(--green2);border:1px solid rgba(46,125,82,.4)}
.status.cancelled{background:rgba(100,80,70,.2);color:var(--ink3);border:1px solid var(--line2)}

/* ORDERS LIST */
.orders-list{display:flex;flex-direction:column;gap:10px}
.order-card{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:14px;transition:border-color .15s}
.order-card:hover{border-color:var(--ember)}
.oc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.oc-name{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--cream)}
.oc-time{font-size:11px;color:var(--ink4);margin-top:1px}
.oc-total{font-family:'DM Mono',monospace;font-size:16px;color:var(--gold2);font-weight:500}
.oc-items{font-size:12px;color:var(--ink3);margin-bottom:10px;line-height:1.5}
.oc-addr{font-size:12px;color:var(--ink3);margin-bottom:10px}
.oc-actions{display:flex;gap:6px;flex-wrap:wrap}
.oc-select{font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:600;
  background:var(--bg3);color:var(--cream);border:1px solid var(--line2);
  border-radius:var(--rsm);padding:6px 10px;cursor:pointer;outline:none;}
.oc-select:focus{border-color:var(--ember)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(8,6,4,.85);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;display:none}
.modal-bg.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;
  padding:24px;width:100%;max-width:440px;max-height:90dvh;overflow-y:auto;}
.modal-title{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--cream);margin-bottom:16px}
.fg{margin-bottom:12px}
.fl{font-size:10px;font-weight:700;color:var(--ink3);margin-bottom:5px;display:block;
  letter-spacing:.8px;text-transform:uppercase}
.fi{width:100%;background:var(--bg3);border:1.5px solid var(--line2);border-radius:var(--rsm);
  padding:10px 13px;font-family:'Instrument Sans',sans-serif;font-size:14px;
  color:var(--cream);outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--ember)}
.fi::placeholder{color:var(--ink4)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--bg3);border:1px solid var(--ember);color:var(--cream);
  padding:9px 18px;border-radius:99px;font-size:13px;font-weight:600;
  opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:300;
  font-family:'Instrument Sans',sans-serif;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 24px;color:var(--ink3)}
.empty-state span{font-size:48px;display:block;margin-bottom:12px}
.empty-state p{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--cream2);margin-bottom:6px}
.spinner{width:32px;height:32px;border:3px solid var(--line2);border-top-color:var(--ember);
  border-radius:50%;animation:spin .8s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

/* DIVIDER */
.divider{border:none;border-top:1px solid var(--line2);margin:16px 0}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-mark">🍕</div>
  <div class="login-title">Panel Admin</div>
  <div class="login-sub">Corteza Oculta · Acceso restringido<br>Solo el dueño del negocio puede entrar</div>
  <button class="google-btn" onclick="signInWithGoogle()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Entrar con Google
  </button>
  <div class="login-note">Solo tu cuenta de Google tiene acceso</div>
</div>

<!-- APP (oculta hasta login) -->
<div id="appScreen" style="display:none">
  <header class="hdr">
    <div>
      <div class="hdr-logo">Corteza <em>Oculta</em> <span>Admin</span></div>
    </div>
    <div class="user-info">
      <img class="user-avatar" id="userAvatar" src="" alt="">
      <span class="user-name" id="userName"></span>
      <button class="logout-btn" onclick="signOut()">Salir</button>
    </div>
  </header>

  <div class="main">
    <div class="page-title">Panel de control</div>
    <div class="page-sub">Gestiona productos y pedidos</div>

    <div class="tabs">
      <div class="tab active" id="tabOrders" onclick="switchTab('orders')">📋 Pedidos</div>
      <div class="tab" id="tabProducts" onclick="switchTab('products')">🍕 Productos</div>
    </div>

    <!-- PEDIDOS -->
    <div id="panelOrders">
      <div id="ordersContent"><div class="spinner"></div></div>
    </div>

    <!-- PRODUCTOS -->
    <div id="panelProducts" style="display:none">
      <div id="productsContent"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- MODAL SUBIR FOTO -->
<div class="modal-bg" id="uploadModal">
  <div class="modal">
    <div class="modal-title">📸 Foto de producto</div>
    <div class="fg">
      <label class="fl">Producto</label>
      <div class="fi" style="background:var(--bg4);color:var(--ink3)" id="uploadProductName">—</div>
    </div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" onchange="onFileSelected(event)">
      <span class="uz-icon">🖼️</span>
      <div class="uz-text">Toca para subir foto</div>
      <div class="uz-sub">JPG, PNG · Máx 5MB</div>
      <img class="upload-preview" id="uploadPreview">
    </div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-full btn-ghost" onclick="closeUploadModal()">Cancelar</button>
      <button class="btn-full btn-ember" id="uploadBtn" onclick="uploadPhoto()" style="display:none">Subir foto</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut as fbSignOut}
  from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,doc,collection,getDoc,onSnapshot,updateDoc,query,orderBy,limit}
  from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getStorage,ref,uploadBytesResumable,getDownloadURL,deleteObject}
  from'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const app=initializeApp({
  apiKey:"AIzaSyDKGTeRqhcmAUuSg7dAGZ9bmLIlNpolCo4",
  authDomain:"cortezaoculta-c87348f6.firebaseapp.com",
  projectId:"cortezaoculta-c87348f6",
  storageBucket:"cortezaoculta-c87348f6.firebasestorage.app",
  messagingSenderId:"252563057583",
  appId:"1:252563057583:web:57acbb3c316aa2c36bdd5a",
});
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);
const provider=new GoogleAuthProvider();

// ── TU EMAIL — CAMBIA ESTO ────────────────────
const ALLOWED_EMAIL='chrisrod120404@gmail.com';

let currentUser=null;
let menu={recipes:[],sizes:[],categories:[]};
let uploadFile=null;
let uploadProductId=null;
let ordersUnsub=null;

// ── AUTH ──────────────────────────────────────
onAuthStateChanged(auth,user=>{
  if(user&&user.email===ALLOWED_EMAIL){
    currentUser=user;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').style.display='block';
    document.getElementById('userAvatar').src=user.photoURL||'';
    document.getElementById('userName').textContent=user.displayName||user.email;
    initApp();
  }else if(user){
    // Email no autorizado
    fbSignOut(auth);
    showToast('❌ Cuenta no autorizada');
  }else{
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appScreen').style.display='none';
  }
});

window.signInWithGoogle=async()=>{
  try{await signInWithPopup(auth,provider)}
  catch(e){showToast('❌ Error al iniciar sesión')}
};
window.signOut=()=>fbSignOut(auth);

// ── INIT ──────────────────────────────────────
async function initApp(){
  await loadMenu();
  loadOrders();
}

async function loadMenu(){
  try{
    const[rS,sS,cS]=await Promise.all([
      getDoc(doc(db,'menu','recipes')),
      getDoc(doc(db,'menu','sizes')),
      getDoc(doc(db,'menu','categories')),
    ]);
    menu.recipes=rS.exists()?rS.data().items||[];
    menu.sizes=sS.exists()?sS.data().items||[];
    menu.categories=cS.exists()?cS.data().items||[];
  }catch(e){console.error('loadMenu',e)}
}

// ── TABS ──────────────────────────────────────
window.switchTab=tab=>{
  document.getElementById('panelOrders').style.display=tab==='orders'?'block':'none';
  document.getElementById('panelProducts').style.display=tab==='products'?'block':'none';
  document.getElementById('tabOrders').className='tab'+(tab==='orders'?' active':'');
  document.getElementById('tabProducts').className='tab'+(tab==='products'?' active':'');
  if(tab==='products')renderProducts();
};

// ── ORDERS ────────────────────────────────────
function loadOrders(){
  const q=query(collection(db,'portal_orders'),orderBy('createdAt','desc'),limit(50));
  if(ordersUnsub)ordersUnsub();
  ordersUnsub=onSnapshot(q,snap=>{
    const orders=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderOrders(orders);
  });
}

const STATUS_LABELS={
  PENDING:'Pendiente',CONFIRMED:'Confirmado',PREPARING:'Preparando',
  READY:'Listo',DELIVERED:'Entregado',CANCELLED:'Cancelado'
};
const STATUS_OPTS=['PENDING','CONFIRMED','PREPARING','READY','DELIVERED','CANCELLED'];

function renderOrders(orders){
  const el=document.getElementById('ordersContent');
  if(!orders.length){
    el.innerHTML='<div class="empty-state"><span>📋</span><p>Sin pedidos aún</p></div>';
    return;
  }
  let html='<div class="orders-list">';
  for(const o of orders){
    const st=(o.status||'PENDING').toLowerCase();
    const ts=o.createdAt?.toDate?o.createdAt.toDate():new Date();
    const timeStr=ts.toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
    const itemsStr=(o.items||[]).map(i=>`${i.qty}× ${i.recipeName}${i.halfRecipeName?' + '+i.halfRecipeName:''} (${i.sizeName})`).join(' · ');
    html+=`<div class="order-card">
      <div class="oc-head">
        <div>
          <div class="oc-name">${o.customerName||'—'}</div>
          <div class="oc-time">${timeStr} · ${o.phone||''}</div>
        </div>
        <div style="text-align:right">
          <div class="oc-total">$${o.total||0}</div>
          <div style="margin-top:4px"><span class="status ${st}">${STATUS_LABELS[o.status]||o.status}</span></div>
        </div>
      </div>
      <div class="oc-items">${itemsStr||'—'}</div>
      <div class="oc-addr">📍 ${o.address||'—'}${o.address2?' · '+o.address2:''}${o.notes?' · Nota: '+o.notes:''}</div>
      <div class="oc-actions">
        <select class="oc-select" onchange="updateStatus('${o.id}',this.value)">
          ${STATUS_OPTS.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
        </select>
      </div>
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

window.updateStatus=async(id,status)=>{
  try{
    await updateDoc(doc(db,'portal_orders',id),{status});
    showToast(`✅ Estado actualizado: ${STATUS_LABELS[status]}`);
  }catch(e){showToast('❌ Error al actualizar')}
};

// ── PRODUCTS ──────────────────────────────────
const imageCache={};

async function getImageUrl(recipeId){
  if(imageCache[recipeId])return imageCache[recipeId];
  try{
    const url=await getDownloadURL(ref(storage,`products/${recipeId}.jpg`));
    imageCache[recipeId]=url;
    return url;
  }catch(e){return null}
}

async function renderProducts(){
  const el=document.getElementById('productsContent');
  el.innerHTML='<div class="spinner"></div>';
  if(!menu.recipes.length){
    el.innerHTML='<div class="empty-state"><span>🍕</span><p>No hay productos en el menú</p></div>';
    return;
  }
  // Load all images
  await Promise.allSettled(menu.recipes.map(r=>getImageUrl(r.id)));

  let html='<div class="recipe-grid">';
  for(const r of menu.recipes){
    const imgUrl=imageCache[r.id];
    const catM=Object.fromEntries(menu.categories.map(c=>[c.name,c]));
    const catEmoji=catM[r.category]?.emoji||'🍽️';
    html+=`<div class="recipe-card">
      <div class="rc-img">
        ${imgUrl
          ?`<img src="${imgUrl}" alt="${r.name}" style="width:100%;height:100%;object-fit:cover">`
          :`<span>${r.emoji||catEmoji}</span>`}
      </div>
      <div class="rc-body">
        <div class="rc-name">${r.name}</div>
        <div class="rc-cat">${r.category}</div>
        <div class="rc-actions">
          <button class="btn btn-ember" onclick="openUpload('${r.id}','${r.name.replace(/'/g,"\\'")}')">
            ${imgUrl?'📸 Cambiar foto':'📸 Subir foto'}
          </button>
          ${imgUrl?`<button class="btn btn-ghost" onclick="removePhoto('${r.id}')">🗑</button>`:''}
        </div>
      </div>
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

// ── UPLOAD ────────────────────────────────────
window.openUpload=(id,name)=>{
  uploadProductId=id;
  uploadFile=null;
  document.getElementById('uploadProductName').textContent=name;
  document.getElementById('uploadPreview').style.display='none';
  document.getElementById('uploadBtn').style.display='none';
  document.getElementById('progressBar').style.display='none';
  document.getElementById('progressFill').style.width='0%';
  document.getElementById('fileInput').value='';
  document.getElementById('uploadModal').classList.add('on');
};

window.closeUploadModal=()=>{
  document.getElementById('uploadModal').classList.remove('on');
  uploadFile=null;uploadProductId=null;
};

window.onFileSelected=(e)=>{
  const file=e.target.files[0];
  if(!file)return;
  if(file.size>5*1024*1024){showToast('❌ Imagen demasiado grande (máx 5MB)');return}
  uploadFile=file;
  const reader=new FileReader();
  reader.onload=ev=>{
    const preview=document.getElementById('uploadPreview');
    preview.src=ev.target.result;
    preview.style.display='block';
  };
  reader.readAsDataURL(file);
  document.getElementById('uploadBtn').style.display='flex';
};

window.uploadPhoto=()=>{
  if(!uploadFile||!uploadProductId)return;
  const storageRef=ref(storage,`products/${uploadProductId}.jpg`);
  const task=uploadBytesResumable(storageRef,uploadFile,{contentType:'image/jpeg'});
  document.getElementById('progressBar').style.display='block';
  document.getElementById('uploadBtn').disabled=true;
  task.on('state_changed',
    snap=>{
      const pct=Math.round(snap.bytesTransferred/snap.totalBytes*100);
      document.getElementById('progressFill').style.width=pct+'%';
    },
    err=>{showToast('❌ Error al subir: '+err.message);document.getElementById('uploadBtn').disabled=false},
    async()=>{
      const url=await getDownloadURL(task.snapshot.ref);
      imageCache[uploadProductId]=url;
      closeUploadModal();
      showToast('✅ Foto subida correctamente');
      renderProducts();
    }
  );
};

window.removePhoto=async(id)=>{
  if(!confirm('¿Eliminar la foto de este producto?'))return;
  try{
    await deleteObject(ref(storage,`products/${id}.jpg`));
    delete imageCache[id];
    showToast('✅ Foto eliminada');
    renderProducts();
  }catch(e){showToast('❌ Error al eliminar')}
};

// ── UTILS ─────────────────────────────────────
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}
</script>
