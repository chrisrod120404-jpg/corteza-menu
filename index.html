<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Corteza Oculta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0A08;--bg2:#161310;--bg3:#1F1A15;--bg4:#2A231C;
  --cream:#F2EBE0;--cream2:#E8DDD0;--cream3:#D9CBBA;
  --ember:#D4521E;--ember2:#E8733F;--ember3:#F59060;
  --gold:#C8901A;--gold2:#E8B84B;
  --green:#2E7D52;--green2:#3DAA6E;
  --ink3:#8A7A6A;--ink4:#5A4E42;
  --line:rgba(242,235,224,.08);--line2:rgba(242,235,224,.15);
  --r:14px;--rsm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--cream);font-family:'Instrument Sans',sans-serif;min-height:100dvh;overflow-x:hidden}

/* NOISE */
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  background-size:200px;opacity:1;}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line2);
  padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-mark{width:34px;height:34px;border-radius:50%;background:var(--ember);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  box-shadow:0 0 0 4px rgba(212,82,30,.2);}
.hdr-name{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--cream);line-height:1}
.hdr-name em{color:var(--ember3);font-style:italic}
.hdr-sub{font-size:10px;color:var(--ink3);letter-spacing:.7px;text-transform:uppercase;margin-top:1px}
.hdr-pill{font-size:10px;font-weight:600;letter-spacing:.5px;
  color:var(--green2);background:rgba(46,125,82,.18);border:1px solid rgba(46,125,82,.3);
  border-radius:99px;padding:4px 10px;}

/* HERO */
.hero{background:linear-gradient(160deg,#1A100A 0%,var(--bg2) 100%);
  padding:28px 18px 24px;border-bottom:1px solid var(--line2);position:relative;overflow:hidden;}
.hero-glow{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,82,30,.15) 0%,transparent 70%);pointer-events:none;}
.hero-tag{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--ember3);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.hero-tag::before{content:'';width:16px;height:1px;background:var(--ember3);display:block}
.hero-title{font-family:'Fraunces',serif;font-size:32px;font-weight:900;color:var(--cream);
  line-height:1.05;margin-bottom:8px;}
.hero-title em{font-style:italic;color:var(--gold2)}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap}
.hero-badge{font-size:11px;color:var(--ink3);background:var(--bg3);
  border:1px solid var(--line2);border-radius:99px;padding:4px 10px;}

/* RETURNING CUSTOMER BANNER */
.returning-banner{background:var(--bg2);border-bottom:2px solid var(--ember);
  padding:14px 18px;display:none;position:relative;z-index:1;}
.returning-banner.show{display:block}
.rb-title{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--cream);margin-bottom:2px}
.rb-sub{font-size:12px;color:var(--ink3);margin-bottom:10px}
.rb-actions{display:flex;gap:8px;}
.rb-btn{font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;
  border-radius:var(--rsm);padding:8px 14px;cursor:pointer;border:none;transition:all .15s;}
.rb-btn.primary{background:var(--ember);color:var(--cream);}
.rb-btn.primary:hover{background:var(--ember2)}
.rb-btn.ghost{background:transparent;color:var(--ink3);border:1px solid var(--line2);}
.rb-btn.ghost:hover{color:var(--cream);border-color:var(--line2)}
.rb-order-preview{background:var(--bg3);border-radius:var(--rsm);padding:10px 12px;
  margin-bottom:10px;border:1px solid var(--line2);}
.rb-item{font-size:12px;color:var(--cream2);padding:2px 0;}
.rb-total{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold2);
  margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}

/* SECTION */
.section{padding:20px 14px 0;position:relative;z-index:1}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px solid var(--line2);}
.sec-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--cream);
  display:flex;align-items:center;gap:8px;}
.sec-count{font-size:11px;color:var(--ink3);background:var(--bg3);
  border-radius:99px;padding:2px 9px;margin-left:auto;border:1px solid var(--line);}

/* PRODUCT CARDS */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px;margin-bottom:24px}
.pc{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;
  cursor:pointer;transition:border-color .18s,transform .12s;position:relative;overflow:hidden;}
.pc:hover{border-color:var(--ember);transform:translateY(-2px)}
.pc:active{transform:scale(.97)}
.pc-img{width:100%;height:110px;object-fit:cover;display:block;background:var(--bg3)}
.pc-img-placeholder{width:100%;height:110px;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:40px;}
.pc-body{padding:11px 12px 12px}
.pc-name{font-family:'Fraunces',serif;font-size:14px;font-weight:700;color:var(--cream);
  margin-bottom:5px;line-height:1.25}
.pc-foot{display:flex;align-items:center;justify-content:space-between}
.pc-price{font-size:12px;color:var(--ember3);font-family:'DM Mono',monospace;font-weight:500}
.pc-arr{font-size:13px;color:var(--ink4);transition:transform .15s,color .15s}
.pc:hover .pc-arr{transform:translateX(3px);color:var(--ember3)}
.pc-sold{position:absolute;inset:0;background:rgba(12,10,8,.8);
  display:flex;align-items:center;justify-content:center;border-radius:15px;
  font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.5px;text-transform:uppercase}

/* BOTTOM BAR */
.btmbar{position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--bg2);border-top:2px solid var(--ember);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);}
.btmbar.show{transform:translateY(0)}
.btmbar-inner{display:flex;align-items:center;gap:12px}
.btm-left{flex:1}
.btm-count{font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.btm-total{font-family:'Fraunces',serif;font-size:25px;font-weight:900;color:var(--gold2);line-height:1}
.btm-btn{background:var(--ember);color:var(--cream);border:none;border-radius:var(--rsm);
  padding:13px 22px;font-family:'Instrument Sans',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;white-space:nowrap;letter-spacing:.2px;transition:background .15s;}
.btm-btn:hover{background:var(--ember2)}
.menu-spacer{height:90px}

/* SHEET */
.overlay{position:fixed;inset:0;background:rgba(8,6,4,.78);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);
  border-radius:22px 22px 0 0;border-top:2px solid var(--ember);
  z-index:101;max-height:93dvh;overflow-y:auto;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom,16px);}
.sheet.on{transform:translateY(0)}
.handle{width:36px;height:4px;background:var(--line2);border-radius:99px;margin:12px auto 4px}
.sc{padding:0 16px 28px}
.sh-title{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--cream);
  margin:8px 0 2px;line-height:1.1}
.sh-sub{font-size:12px;color:var(--ink3);margin-bottom:14px;letter-spacing:.2px}

/* STEP LABELS */
.step{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.step-n{width:22px;height:22px;background:var(--ember);border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--cream);flex-shrink:0}
.step-n.g{background:var(--green)}
.step-t{font-size:13px;font-weight:600;color:var(--cream);letter-spacing:.1px}
.step-h{font-size:11px;color:var(--ember3);font-family:'DM Mono',monospace;margin-left:4px}

/* CHIPS */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg3);border:1.5px solid var(--line2);border-radius:var(--rsm);
  padding:9px 14px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;}
.chip.sel{border-color:var(--ember);background:rgba(212,82,30,.12)}
.chip-p{font-size:14px;font-weight:700;color:var(--cream);font-family:'DM Mono',monospace}
.chip.sel .chip-p{color:var(--ember3)}
.chip-n{font-size:10px;color:var(--ink3);letter-spacing:.4px;text-transform:uppercase}
.chip.sel .chip-n{color:var(--ember)}

/* HALF TOGGLE */
.half-toggle{background:var(--bg3);border:1.5px solid var(--line2);border-radius:var(--r);
  padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:all .18s;margin-bottom:2px;}
.half-toggle.on{border-color:var(--green);background:rgba(46,125,82,.1)}
.ht-body{flex:1}
.ht-t{font-size:14px;font-weight:600;color:var(--cream)}
.ht-s{font-size:11px;color:var(--ink3);margin-top:1px}
.half-toggle.on .ht-t{color:var(--green2)}
.half-toggle.on .ht-s{color:var(--green)}
.sw{width:40px;height:22px;background:var(--bg4);border-radius:99px;
  position:relative;transition:background .2s;flex-shrink:0}
.half-toggle.on .sw{background:var(--green)}
.sw-t{position:absolute;width:16px;height:16px;background:var(--cream);
  border-radius:99px;top:3px;left:3px;transition:left .2s}
.half-toggle.on .sw-t{left:21px}

/* EXTRAS */
.ing-grid{display:flex;flex-wrap:wrap;gap:8px}
.ing-x{background:var(--bg3);border:1.5px solid var(--line2);border-radius:var(--r);
  padding:10px 12px;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:10px;flex:1;min-width:130px;}
.ing-x:hover:not(.on){border-color:var(--ember2)}
.ing-x.on{border-color:var(--ember);background:rgba(212,82,30,.1)}
.ix-ico{font-size:18px}
.ix-nm{flex:1;font-size:13px;font-weight:600;color:var(--cream)}
.ix-pr{font-size:11px;font-weight:600;background:var(--bg4);color:var(--ink3);
  padding:2px 8px;border-radius:99px;white-space:nowrap;font-family:'DM Mono',monospace}
.ing-x.on .ix-pr{background:var(--ember);color:var(--cream)}
.extras-box{background:rgba(212,82,30,.1);border:1px solid var(--ember);
  border-radius:var(--rsm);padding:9px 13px;font-size:12px;font-weight:600;
  color:var(--ember3);margin-top:8px;font-family:'DM Mono',monospace}

/* HALVES GRID */
.halves-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.half-card{background:var(--bg3);border:1.5px solid var(--line2);border-radius:var(--r);
  padding:10px 6px;text-align:center;cursor:pointer;transition:all .15s;overflow:hidden}
.half-card.sel{border-color:var(--green);background:rgba(46,125,82,.1)}
.hc-img{width:100%;height:48px;object-fit:cover;border-radius:8px;margin-bottom:4px;background:var(--bg4)}
.hc-e{font-size:24px;display:block;margin-bottom:4px}
.hc-n{font-size:10px;font-weight:700;color:var(--ink3);line-height:1.3}
.half-card.sel .hc-n{color:var(--green2)}

/* QTY */
.qty-row{display:flex;align-items:center;gap:14px}
.qty-btn{width:38px;height:38px;background:var(--bg3);border:1.5px solid var(--line2);
  border-radius:var(--rsm);color:var(--cream);font-size:22px;font-weight:300;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.qty-btn:hover{background:rgba(212,82,30,.15);border-color:var(--ember);color:var(--ember3)}
.qty-val{font-family:'Fraunces',serif;font-size:28px;font-weight:700;min-width:28px;text-align:center}

/* BUTTONS */
.btn-main{width:100%;background:var(--ember);color:var(--cream);border:none;
  border-radius:var(--r);padding:15px 18px;font-family:'Instrument Sans',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  transition:background .15s;margin-top:18px;letter-spacing:.2px;}
.btn-main:disabled{opacity:.3;cursor:not-allowed}
.btn-main:not(:disabled):hover{background:var(--ember2)}
.btn-main.green{background:var(--green)}
.btn-main.green:hover{background:var(--green2)}
.btn-mono{font-family:'DM Mono',monospace;font-size:16px;font-weight:500}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink3);
  border-radius:var(--r);padding:12px 18px;font-family:'Instrument Sans',sans-serif;
  font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:10px;width:100%;}
.btn-ghost:hover{border-color:var(--line2);color:var(--cream)}

/* CHECKOUT */
.order-sum{background:var(--bg3);border-radius:var(--r);border:1px solid var(--line2);
  padding:14px;margin-bottom:12px}
.os-it{display:flex;justify-content:space-between;align-items:flex-start;
  padding:8px 0;border-bottom:1px solid var(--line)}
.os-it:last-child{border-bottom:none}
.os-nm{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--cream)}
.os-mod{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.4}
.os-pr{font-size:13px;font-weight:600;color:var(--ember3);white-space:nowrap;
  margin-left:12px;font-family:'DM Mono',monospace}
.os-rm{color:var(--ink4);cursor:pointer;font-size:14px;margin-left:6px;transition:color .12s}
.os-rm:hover{color:var(--ember)}
.total-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0 0;border-top:1.5px solid var(--line2);margin-top:4px}
.total-lbl{font-size:14px;font-weight:600;color:var(--cream)}
.total-val{font-family:'Fraunces',serif;font-size:28px;font-weight:900;color:var(--ember3)}

/* FORM */
.fg{margin-bottom:12px}
.fl{font-size:10px;font-weight:700;color:var(--ink3);margin-bottom:5px;display:block;
  letter-spacing:.8px;text-transform:uppercase}
.fi{width:100%;background:var(--bg3);border:1.5px solid var(--line2);border-radius:var(--rsm);
  padding:11px 13px;font-family:'Instrument Sans',sans-serif;font-size:14px;
  color:var(--cream);outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--ember);background:var(--bg4)}
.fi::placeholder{color:var(--ink4)}
.divider{border:none;border-top:1px solid var(--line2);margin:14px 0}

/* COUNTDOWN TIMER (edit window) */
.edit-timer{background:rgba(200,144,26,.12);border:1px solid var(--gold);
  border-radius:var(--rsm);padding:10px 14px;margin-top:12px;
  display:flex;align-items:center;gap:10px;display:none}
.edit-timer.show{display:flex}
.et-clock{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--gold2);min-width:36px}
.et-text{font-size:12px;color:var(--ink3);flex:1}
.et-cancel{font-size:12px;font-weight:600;color:var(--ember3);cursor:pointer;background:none;border:none;
  font-family:'Instrument Sans',sans-serif;padding:0;}
.et-cancel:hover{color:var(--ember2)}

/* TRACKER */
.tracker{display:none;flex-direction:column;align-items:center;
  padding:60px 24px 40px;text-align:center;gap:10px;position:relative;z-index:1}
.tracker.on{display:flex}
.tr-emoji{font-size:64px;animation:bob .9s ease infinite alternate}
.tr-badge{background:var(--bg2);color:var(--cream2);border-radius:99px;padding:5px 14px;
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border:1px solid var(--line2);}
.tr-status{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--cream);margin-top:4px}
.tr-sub{font-size:13px;color:var(--ink3);max-width:280px;line-height:1.6}
.tr-steps{display:flex;gap:6px;margin-top:10px}
.tr-step{width:26px;height:5px;border-radius:99px;background:var(--line2);transition:background .4s}
.tr-step.done{background:var(--ember)}
.tr-step.active{background:var(--gold2)}
.tr-id{font-size:11px;color:var(--ink4);margin-top:4px;font-family:'DM Mono',monospace}
.tr-edit-btn{margin-top:16px;background:transparent;border:1px solid var(--line2);
  color:var(--ink3);border-radius:var(--rsm);padding:9px 16px;
  font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s;}
.tr-edit-btn:hover{border-color:var(--ember);color:var(--ember3)}
.tr-timer-txt{font-size:12px;color:var(--ink4);margin-top:8px;font-family:'DM Mono',monospace}

@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}

/* MISC */
.spinner{width:36px;height:36px;border:3px solid var(--line2);border-top-color:var(--ember);
  border-radius:50%;animation:spin .8s linear infinite;margin:70px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px}
.empty span{font-size:48px;display:block;margin-bottom:10px}
.empty p{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--cream2)}
.empty small{font-size:13px;color:var(--ink3);margin-top:4px;display:block}
.toast{position:fixed;bottom:106px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--bg3);border:1px solid var(--ember);color:var(--cream);
  padding:9px 18px;border-radius:99px;font-size:13px;font-weight:600;
  opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:200;
  font-family:'Instrument Sans',sans-serif;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-mark">🍕</div>
    <div>
      <div class="hdr-name">Corteza <em>Oculta</em></div>
      <div class="hdr-sub">Ordena en línea</div>
    </div>
  </div>
  <div class="hdr-pill" id="statusPill">● Abierto</div>
</header>

<!-- Returning customer banner -->
<div class="returning-banner" id="returningBanner">
  <div class="rb-title">¡Hola de nuevo! 👋</div>
  <div class="rb-sub">Tienes una orden reciente guardada</div>
  <div class="rb-order-preview" id="rbPreview"></div>
  <div class="rb-actions">
    <button class="rb-btn primary" onclick="viewLastOrder()">Ver mi orden</button>
    <button class="rb-btn ghost" onclick="dismissReturning()">Pedir algo nuevo</button>
  </div>
</div>

<div id="menuView">
  <div class="hero">
    <div class="hero-glow"></div>
    <div class="hero-tag">León, Guanajuato</div>
    <div class="hero-title">Pide a domicilio,<br><em>recíbelo caliente.</em></div>
    <div class="hero-pills">
      <span class="hero-badge">🔥 Horno de piedra</span>
      <span class="hero-badge">🧀 Ingredientes frescos</span>
      <span class="hero-badge">🛵 Entrega rápida</span>
    </div>
  </div>

  <div class="spinner" id="spinner"></div>
  <div id="menuContent" style="display:none"></div>
  <div class="menu-spacer"></div>
</div>

<div class="tracker" id="tracker">
  <div class="tr-emoji" id="trEmoji">🔔</div>
  <div class="tr-badge" id="trBadge">PEDIDO #——</div>
  <div class="tr-status" id="trStatus">Pedido enviado</div>
  <div class="tr-sub" id="trSub">Espera la confirmación</div>
  <div class="tr-steps" id="trSteps"></div>
  <div class="tr-id" id="trId"></div>
  <button class="tr-edit-btn" id="trEditBtn" onclick="openEditWindow()" style="display:none">✏️ Editar / Cancelar pedido</button>
  <div class="tr-timer-txt" id="trTimerTxt"></div>
</div>

<div class="btmbar" id="btmbar">
  <div class="btmbar-inner">
    <div class="btm-left">
      <div class="btm-count" id="btmCount">0 artículos</div>
      <div class="btm-total" id="btmTotal">$0</div>
    </div>
    <button class="btm-btn" onclick="openCheckout()">Ver orden →</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" onclick="closeSheet()"></div>

<div class="sheet" id="productSheet">
  <div class="handle"></div>
  <div class="sc" id="productSheetContent"></div>
</div>

<div class="sheet" id="checkoutSheet">
  <div class="handle"></div>
  <div class="sc" id="checkoutContent"></div>
</div>

<div class="sheet" id="editSheet">
  <div class="handle"></div>
  <div class="sc" id="editSheetContent"></div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,collection,getDoc,onSnapshot,addDoc,updateDoc,deleteDoc,serverTimestamp}
  from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getStorage,ref,getDownloadURL}
  from'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const app=initializeApp({
  apiKey:"AIzaSyDKGTeRqhcmAUuSg7dAGZ9bmLIlNpolCo4",
  authDomain:"cortezaoculta-c87348f6.firebaseapp.com",
  projectId:"cortezaoculta-c87348f6",
  storageBucket:"cortezaoculta-c87348f6.firebasestorage.app",
  messagingSenderId:"252563057583",
  appId:"1:252563057583:web:57acbb3c316aa2c36bdd5a",
});
const db=getFirestore(app);
const storage=getStorage(app);

const EXTRA=15;
const LS_KEY='co_last_order';
const EDIT_WINDOW_MS=60000; // 1 minuto

let menu={recipes:[],sizes:[],categories:[],ingredients:[]};
let cart=[];
let activeSheet=null;
let p={};
let currentOrderId=null;
let orderCreatedAt=null;
let editTimerInterval=null;
let unsub=null;

// ── RETURNING CUSTOMER ────────────────────────
function checkReturningCustomer(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const saved=JSON.parse(raw);
    if(!saved.orderId||!saved.createdAt)return;
    // Solo mostramos si el pedido fue en las últimas 6 horas
    if(Date.now()-saved.createdAt>6*60*60*1000){localStorage.removeItem(LS_KEY);return;}
    const banner=document.getElementById('returningBanner');
    const preview=document.getElementById('rbPreview');
    let html='';
    for(const it of(saved.items||[]).slice(0,3))
      html+=`<div class="rb-item">${it.qty}× ${it.displayName} — <span style="font-family:'DM Mono',monospace;color:var(--gold2)">$${it.unitPrice*it.qty}</span></div>`;
    if((saved.items||[]).length>3)html+=`<div class="rb-item" style="color:var(--ink4)">+${saved.items.length-3} más...</div>`;
    html+=`<div class="rb-total">Total: $${saved.total}</div>`;
    preview.innerHTML=html;
    banner.classList.add('show');
    window._savedOrder=saved;
  }catch(e){}
}

window.dismissReturning=()=>{
  document.getElementById('returningBanner').classList.remove('show');
};

window.viewLastOrder=()=>{
  const saved=window._savedOrder;
  if(!saved)return;
  document.getElementById('returningBanner').classList.remove('show');
  const withinEdit=Date.now()-saved.createdAt<EDIT_WINDOW_MS;
  // Mostrar tracker del pedido anterior
  document.getElementById('menuView').style.display='none';
  currentOrderId=saved.orderId;
  orderCreatedAt=saved.createdAt;
  startTracker(saved.orderId);
};

function saveOrderToLS(orderId,items,total){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({
      orderId,items,total,createdAt:Date.now()
    }));
  }catch(e){}
}

// ── MENÚ ──────────────────────────────────────
async function loadMenu(){
  try{
    const[rS,sS,cS,iS]=await Promise.all([
      getDoc(doc(db,'menu','recipes')),
      getDoc(doc(db,'menu','sizes')),
      getDoc(doc(db,'menu','categories')),
      getDoc(doc(db,'menu','ingredients')),
    ]);
    if(!rS.exists()){
      document.getElementById('spinner').style.display='none';
      document.getElementById('menuContent').innerHTML=
        '<div class="empty"><span>😴</span><p>Menú no disponible</p><small>La pizzería aún no ha publicado su menú</small></div>';
      document.getElementById('menuContent').style.display='block';
      return;
    }
    menu.recipes=rS.data().items||[];
    menu.sizes=sS.exists()?sS.data().items:[];
    menu.categories=cS.exists()?cS.data().items:[];
    menu.ingredients=iS.exists()?iS.data().items:[];
    await loadProductImages();
    renderMenu();
  }catch(e){
    document.getElementById('spinner').innerHTML=
      '<div class="empty"><span>⚠️</span><p>Error al cargar</p><small>Revisa tu conexión</small></div>';
  }
}

const imageCache={};
async function loadProductImages(){
  const promises=menu.recipes.map(async r=>{
    try{
      const url=await getDownloadURL(ref(storage,`products/${r.id}.jpg`));
      imageCache[r.id]=url;
    }catch(e){/* sin imagen, usa emoji */}
  });
  await Promise.allSettled(promises);
}

function renderMenu(){
  document.getElementById('spinner').style.display='none';
  const catM=Object.fromEntries(menu.categories.map(c=>[c.name,c]));
  const grps={};
  for(const r of menu.recipes)(grps[r.category]||(grps[r.category]=[])).push(r);
  let html='';
  for(const[cat,rs]of Object.entries(grps)){
    const m=catM[cat]||{emoji:'🍽️',label:cat};
    html+=`<div class="section"><div class="sec-head">
      <div class="sec-title">${m.emoji} ${m.label}</div>
      <span class="sec-count">${rs.length} opciones</span>
    </div><div class="products-grid">`;
    for(const r of rs){
      const avail=r.available!==false,min=minP(r);
      const hasImg=!!imageCache[r.id];
      html+=`<div class="pc" onclick="${avail?`openPicker('${r.id}')`:''}" role="button" tabindex="0">
        ${hasImg
          ?`<img class="pc-img" src="${imageCache[r.id]}" alt="${r.name}" loading="lazy">`
          :`<div class="pc-img-placeholder">${r.emoji||m.emoji}</div>`}
        <div class="pc-body">
          <div class="pc-name">${r.name}</div>
          <div class="pc-foot">
            <div class="pc-price">Desde $${min}</div>
            <div class="pc-arr">→</div>
          </div>
        </div>
        ${!avail?'<div class="pc-sold">Agotado</div>':''}
      </div>`;
    }
    html+='</div></div>';
  }
  document.getElementById('menuContent').innerHTML=html;
  document.getElementById('menuContent').style.display='block';
}

const minP=r=>{const v=Object.values(r.prices||{}).filter(x=>x>0);return v.length?Math.min(...v):0};
const pfS=(r,sid)=>r?.prices?.[sid]||0;

// ── PICKER ────────────────────────────────────
function resetPicker(recipe){
  p={recipe,size:null,qty:1,
     removed:new Set(),added:new Set(),
     halfMode:false,halfRecipe:null,halfAdded:new Set()};
}

window.openPicker=id=>{
  const r=menu.recipes.find(r=>r.id===id);if(!r)return;
  resetPicker(r);renderPicker();openSheet('productSheet');
};

function renderPicker(){
  const{recipe:r,size,qty,removed,added,halfMode,halfRecipe,halfAdded}=p;
  const canHalf=r.category==='PIZZA';
  const recipeIngIds=new Set((r.ingredients||[]).map(i=>i.ingredientId));
  const extras=menu.ingredients.filter(i=>!recipeIngIds.has(i.id)).slice(0,14);
  let n=1,html='';

  const hasImg=!!imageCache[r.id];
  if(hasImg)html+=`<img src="${imageCache[r.id]}" alt="${r.name}" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:12px;display:block">`;

  html+=`<div class="sh-title">${r.emoji||'🍕'} ${r.name}</div>
    <div class="sh-sub">${r.category} · Personaliza tu pedido</div>`;

  if(canHalf){
    html+=`<div class="half-toggle ${halfMode?'on':''}" onclick="toggleHalf()">
      <span style="font-size:20px">🍕</span>
      <div class="ht-body">
        <div class="ht-t">Pizza ½ y ½</div>
        <div class="ht-s">${halfMode?'Activo — elige la 2ª mitad abajo':'Dividir en dos sabores distintos'}</div>
      </div>
      <div class="sw"><div class="sw-t"></div></div>
    </div>`;
  }

  // Tamaño — OBLIGATORIO
  html+=sl(n++,'Elige el tamaño','requerido')+'<div class="chips">';
  for(const s of menu.sizes){
    const pr=pfS(r,s.id);if(!pr)continue;
    html+=`<div class="chip ${size?.id===s.id?'sel':''}" onclick="selSize('${s.id}')">
      <span class="chip-p">$${pr}</span><span class="chip-n">${s.name}</span></div>`;
  }
  html+='</div>';

  if(extras.length>0){
    html+=sl(n++,'¿Algo extra?',`+$${EXTRA} c/u`)+'<div class="ing-grid">';
    for(const ing of extras){
      const on=added.has(ing.name);
      html+=`<div class="ing-x ${on?'on':''}" onclick="toggleExtra('${esc(ing.name)}')">
        <span class="ix-ico">${iEmoji(ing.type)}</span>
        <span class="ix-nm">${ing.name}</span>
        <span class="ix-pr">${on?`+$${EXTRA}`:`$${EXTRA}`}</span></div>`;
    }
    html+='</div>';
    if(added.size>0)html+=`<div class="extras-box">+${added.size} extra${added.size>1?'s':''} · +$${added.size*EXTRA}</div>`;
  }

  if(canHalf&&halfMode){
    const others=menu.recipes.filter(r2=>r2.id!==r.id&&r2.category==='PIZZA'&&r2.available!==false);
    html+=sl(n++,'Segunda mitad','requerido','g')+'<div class="halves-grid">';
    for(const r2 of others){
      const img2=imageCache[r2.id];
      html+=`<div class="half-card ${halfRecipe?.id===r2.id?'sel':''}" onclick="selHalf('${r2.id}')">
        ${img2?`<img class="hc-img" src="${img2}" alt="${r2.name}">`:`<span class="hc-e">${r2.emoji||'🍕'}</span>`}
        <div class="hc-n">${r2.name}</div></div>`;
    }
    html+='</div>';
    if(halfRecipe){
      const h2ids=new Set((halfRecipe.ingredients||[]).map(i=>i.ingredientId));
      const h2ext=menu.ingredients.filter(i=>!h2ids.has(i.id)).slice(0,14);
      if(h2ext.length>0){
        html+=sl(n++,`Extra en ${halfRecipe.name}`,`+$${EXTRA} c/u`,'g')+'<div class="ing-grid">';
        for(const ing of h2ext){
          const on=halfAdded.has(ing.name);
          html+=`<div class="ing-x ${on?'on':''}" onclick="toggleHalfExtra('${esc(ing.name)}')">
            <span class="ix-ico">${iEmoji(ing.type)}</span>
            <span class="ix-nm">${ing.name}</span>
            <span class="ix-pr">${on?`+$${EXTRA}`:`$${EXTRA}`}</span></div>`;
        }
        html+='</div>';
      }
    }
  }

  html+=sl(n++,'Cantidad')+`<div class="qty-row">
    <button class="qty-btn" onclick="chQty(-1)">−</button>
    <span class="qty-val">${qty}</span>
    <button class="qty-btn" onclick="chQty(1)">+</button></div>`;

  const unit=calcUnit();
  const ready=size&&(!halfMode||halfRecipe);
  const btnLabel=!size?'Selecciona un tamaño primero':
                 (halfMode&&!halfRecipe)?'Selecciona la 2ª mitad':
                 halfMode?'Agregar ½ y ½':'Agregar al pedido';

  html+=`<button class="btn-main ${halfMode?'green':''}" onclick="addToCart()" ${!ready?'disabled':''}>
    <span>${btnLabel}</span>
    <span class="btn-mono">${ready?'$'+(unit*qty):'—'}</span></button>`;

  document.getElementById('productSheetContent').innerHTML=html;
}

const sl=(n,t,h='',g='')=>
  `<div class="step"><div class="step-n ${g}">${n}</div><div class="step-t">${t}</div>${h?`<div class="step-h">· ${h}</div>`:''}</div>`;
const iEmoji=type=>{
  if(!type)return'🧀';
  if(type.includes('CARNICOS'))return'🥩';
  if(type.includes('FRUTAS'))return'🌿';
  if(type.includes('LACTEOS'))return'🧀';
  return'➕';
};

function calcUnit(){
  if(!p.size)return 0;
  const b1=pfS(p.recipe,p.size.id);
  const b2=p.halfMode&&p.halfRecipe?pfS(p.halfRecipe,p.size.id):0;
  return(p.halfMode?Math.max(b1,b2):b1)+(p.added.size+(p.halfMode?p.halfAdded.size:0))*EXTRA;
}

window.toggleHalf=()=>{p.halfMode=!p.halfMode;p.halfRecipe=null;p.halfAdded=new Set();renderPicker()};
window.selSize=id=>{p.size=menu.sizes.find(s=>s.id===id);renderPicker()};
window.selHalf=id=>{p.halfRecipe=menu.recipes.find(r=>r.id===id);p.halfAdded=new Set();renderPicker()};
window.chQty=d=>{p.qty=Math.max(1,Math.min(20,p.qty+d));renderPicker()};
window.toggleExtra=n=>{p.added.has(n)?p.added.delete(n):p.added.add(n);renderPicker()};
window.toggleHalfExtra=n=>{p.halfAdded.has(n)?p.halfAdded.delete(n):p.halfAdded.add(n);renderPicker()};

window.addToCart=()=>{
  if(!p.size)return;
  const unit=calcUnit();
  const dn=p.halfMode&&p.halfRecipe
    ?`½ ${p.recipe.name} + ½ ${p.halfRecipe.name} — ${p.size.name}`
    :`${p.recipe.name} — ${p.size.name}`;
  const mods=[];
  if(p.removed.size)mods.push('Sin '+[...p.removed].join(', '));
  if(p.added.size)mods.push('+'   +[...p.added].join(', +'));
  if(p.halfMode&&p.halfAdded.size)mods.push(`½${p.halfRecipe?.name}: +`+[...p.halfAdded].join(', +'));
  cart.push({
    recipeName:p.recipe.name,halfRecipeName:p.halfMode&&p.halfRecipe?p.halfRecipe.name:null,
    sizeId:p.size.id,sizeName:p.size.name,qty:p.qty,unitPrice:unit,
    removedIngredients:[...p.removed],addedIngredients:[...p.added],
    halfRemovedIngredients:[],halfAddedIngredients:p.halfMode?[...p.halfAdded]:[],
    displayName:dn,modsLabel:mods.join(' · '),
  });
  updateBar();closeSheet();showToast(`✅ ${p.recipe.name} agregada`);
};

function updateBar(){
  const total=cart.reduce((s,i)=>s+i.unitPrice*i.qty,0);
  const items=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('btmCount').textContent=`${items} artículo${items!==1?'s':''}`;
  document.getElementById('btmTotal').textContent=`$${total}`;
  document.getElementById('btmbar').classList.toggle('show',cart.length>0);
}

window.openCheckout=()=>{renderCheckout();openSheet('checkoutSheet')};
window.removeItem=idx=>{cart.splice(idx,1);updateBar();cart.length===0?closeSheet():renderCheckout()};

function renderCheckout(){
  const total=cart.reduce((s,i)=>s+i.unitPrice*i.qty,0);
  let html=`<div class="sh-title">Tu orden</div>
    <div class="sh-sub">${cart.length} artículo${cart.length!==1?'s':''} seleccionado${cart.length!==1?'s':''}</div>
    <div class="order-sum">`;
  for(let i=0;i<cart.length;i++){
    const it=cart[i];
    html+=`<div class="os-it">
      <div style="flex:1">
        <div class="os-nm">${it.qty}× ${it.displayName}</div>
        ${it.modsLabel?`<div class="os-mod">${it.modsLabel}</div>`:''}
      </div>
      <div style="display:flex;align-items:center">
        <span class="os-pr">$${it.unitPrice*it.qty}</span>
        <span class="os-rm" onclick="removeItem(${i})">✕</span>
      </div></div>`;
  }
  html+=`</div>
    <div class="total-row">
      <span class="total-lbl">Total a pagar</span>
      <span class="total-val">$${total}</span>
    </div>
    <div class="divider"></div>
    <div class="sh-title" style="font-size:20px;margin-top:4px">Tus datos</div>
    <div style="margin-top:14px">
      <div class="fg"><label class="fl">Nombre</label>
        <input class="fi" id="fName" placeholder="¿Cómo te llamas?" autocomplete="name"></div>
      <div class="fg"><label class="fl">Teléfono</label>
        <input class="fi" id="fPhone" type="tel" placeholder="10 dígitos" autocomplete="tel"></div>
      <div class="fg"><label class="fl">Dirección</label>
        <input class="fi" id="fAddr" placeholder="Calle, número, colonia" autocomplete="street-address"></div>
      <div class="fg"><label class="fl">2ª dirección <span style="color:var(--ink4);font-weight:400;text-transform:none">(opcional)</span></label>
        <input class="fi" id="fAddr2" placeholder="Entre calles, referencias…"></div>
      <div class="fg"><label class="fl">Notas <span style="color:var(--ink4);font-weight:400;text-transform:none">(opcional)</span></label>
        <input class="fi" id="fNotes" placeholder="Indicaciones especiales…"></div>
    </div>
    <button class="btn-main" id="submitBtn" onclick="submitOrder()">
      <span>Enviar pedido</span><span class="btn-mono">$${total}</span>
    </button>
    <button class="btn-ghost" onclick="closeSheet()">← Seguir agregando</button>`;
  document.getElementById('checkoutContent').innerHTML=html;
}

window.submitOrder=async()=>{
  const name=document.getElementById('fName')?.value.trim();
  const phone=document.getElementById('fPhone')?.value.trim();
  const addr=document.getElementById('fAddr')?.value.trim();
  const addr2=document.getElementById('fAddr2')?.value.trim()||'';
  const notes=document.getElementById('fNotes')?.value.trim()||'';
  if(!name){showToast('⚠️ Escribe tu nombre');return}
  if(!phone){showToast('⚠️ Escribe tu teléfono');return}
  if(!addr){showToast('⚠️ Escribe tu dirección');return}
  const btn=document.getElementById('submitBtn');
  if(btn)btn.disabled=true;
  const total=cart.reduce((s,i)=>s+i.unitPrice*i.qty,0);
  try{
    const ref2=await addDoc(collection(db,'portal_orders'),{
      customerName:name,phone,address:addr,address2:addr2,notes,total,
      status:'PENDING',createdAt:serverTimestamp(),
      items:cart.map(it=>({
        recipeName:it.recipeName,halfRecipeName:it.halfRecipeName||null,
        sizeId:it.sizeId,sizeName:it.sizeName,qty:it.qty,unitPrice:it.unitPrice,
        removedIngredients:it.removedIngredients,addedIngredients:it.addedIngredients,
        halfRemovedIngredients:it.halfRemovedIngredients,halfAddedIngredients:it.halfAddedIngredients,
      })),
    });
    currentOrderId=ref2.id;
    orderCreatedAt=Date.now();
    saveOrderToLS(ref2.id,cart,total);
    cart=[];updateBar();closeSheet();
    document.getElementById('menuView').style.display='none';
    startTracker(ref2.id);
    startEditCountdown();
  }catch(e){
    const msg=e?.code==='permission-denied'?'❌ Sin permiso en Firestore':
              e?.code==='unavailable'?'❌ Sin conexión':
              `❌ Error: ${e?.message||'intenta de nuevo'}`;
    showToast(msg);if(btn)btn.disabled=false;
  }
};

// ── EDIT WINDOW (1 minuto) ────────────────────
function startEditCountdown(){
  const btn=document.getElementById('trEditBtn');
  const txt=document.getElementById('trTimerTxt');
  if(btn)btn.style.display='block';
  clearInterval(editTimerInterval);
  editTimerInterval=setInterval(()=>{
    const elapsed=Date.now()-orderCreatedAt;
    const remaining=Math.max(0,EDIT_WINDOW_MS-elapsed);
    const secs=Math.ceil(remaining/1000);
    if(txt)txt.textContent=`Puedes editar por ${secs}s más`;
    if(remaining<=0){
      clearInterval(editTimerInterval);
      if(btn)btn.style.display='none';
      if(txt)txt.textContent='Ventana de edición cerrada';
    }
  },500);
}

window.openEditWindow=()=>{
  const elapsed=Date.now()-orderCreatedAt;
  if(elapsed>EDIT_WINDOW_MS){showToast('⏱ El tiempo de edición expiró');return}
  renderEditSheet();openSheet('editSheet');
};

function renderEditSheet(){
  const saved=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
  const items=saved.items||[];
  const total=saved.total||0;
  const remaining=Math.max(0,EDIT_WINDOW_MS-(Date.now()-orderCreatedAt));
  const secs=Math.ceil(remaining/1000);
  let html=`<div class="sh-title">✏️ Editar orden</div>
    <div class="sh-sub">Tienes ${secs} segundos para modificar</div>
    <div class="order-sum">`;
  for(const it of items){
    html+=`<div class="os-it">
      <div style="flex:1"><div class="os-nm">${it.qty}× ${it.displayName}</div></div>
      <span class="os-pr">$${it.unitPrice*it.qty}</span>
    </div>`;
  }
  html+=`</div>
    <div class="total-row" style="margin-bottom:16px">
      <span class="total-lbl">Total</span>
      <span class="total-val">$${total}</span>
    </div>
    <button class="btn-main" style="background:var(--ember);margin-top:0" onclick="cancelOrder()">
      <span>❌ Cancelar pedido</span><span class="btn-mono">Confirmar</span>
    </button>
    <button class="btn-ghost" onclick="closeSheet()">Mantener pedido</button>`;
  document.getElementById('editSheetContent').innerHTML=html;
}

window.cancelOrder=async()=>{
  if(!currentOrderId)return;
  const elapsed=Date.now()-orderCreatedAt;
  if(elapsed>EDIT_WINDOW_MS){showToast('⏱ El tiempo de edición expiró');closeSheet();return}
  try{
    await updateDoc(doc(db,'portal_orders',currentOrderId),{status:'CANCELLED'});
    localStorage.removeItem(LS_KEY);
    clearInterval(editTimerInterval);
    closeSheet();
    showToast('✅ Pedido cancelado');
    setTimeout(()=>{
      document.getElementById('tracker').classList.remove('on');
      document.getElementById('menuView').style.display='block';
      currentOrderId=null;orderCreatedAt=null;
    },1500);
  }catch(e){showToast('❌ Error al cancelar')}
};

// ── TRACKER ───────────────────────────────────
const SMETA={
  PENDING:  {e:'🔔',s:'Pedido recibido',      d:'La pizzería lo confirmará en breve'},
  CONFIRMED:{e:'✅',s:'Pedido confirmado',     d:'Ya están preparando tu orden'},
  PREPARING:{e:'👨‍🍳',s:'En preparación',       d:'Tu pizza está en el horno 🔥'},
  READY:    {e:'🎉',s:'¡Lista para entregar!',d:'Tu pedido está listo'},
  DELIVERED:{e:'📦',s:'¡Entregado!',           d:'¡Buen provecho! 🍕'},
  CANCELLED:{e:'❌',s:'Cancelado',             d:'Tu pedido fue cancelado'},
};
const STEPS=['PENDING','CONFIRMED','PREPARING','READY','DELIVERED'];

function startTracker(id){
  document.getElementById('tracker').classList.add('on');
  document.getElementById('trBadge').textContent=`PEDIDO #${id.slice(-6).toUpperCase()}`;
  document.getElementById('trId').textContent=id;
  if(unsub)unsub();
  unsub=onSnapshot(doc(db,'portal_orders',id),snap=>{
    if(!snap.exists())return;
    updateTracker(snap.data().status||'PENDING');
  });
}

function updateTracker(st){
  const m=SMETA[st]||SMETA.PENDING;
  document.getElementById('trEmoji').textContent=m.e;
  document.getElementById('trStatus').textContent=m.s;
  document.getElementById('trSub').textContent=m.d;
  const idx=STEPS.indexOf(st);
  document.getElementById('trSteps').innerHTML=STEPS.slice(0,-1).map((_,i)=>
    `<div class="tr-step ${i<idx?'done':i===idx?'active':''}"></div>`).join('');
}

// ── SHEET / OVERLAY ───────────────────────────
function openSheet(id){
  activeSheet=id;
  document.getElementById('overlay').classList.add('on');
  document.getElementById(id).classList.add('on');
  document.body.style.overflow='hidden';
}
window.closeSheet=()=>{
  if(!activeSheet)return;
  document.getElementById('overlay').classList.remove('on');
  document.getElementById(activeSheet).classList.remove('on');
  document.body.style.overflow='';
  activeSheet=null;
};

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}
const esc=s=>s.replace(/'/g,"\\'");

checkReturningCustomer();
loadMenu();
</script>
